["assin"],mark:["assin"],hint:"Olhe o rodapé: há marca de quem escreveu?",why:"Tese, argumentos e conclusão assinados por um autor: artigo de opinião."}),or({id:"lin-gen-cartum-d",alvo:"cartum",lvl:3,confunde:["charge","tirinha","anuncio"],hint:{t:"Procure a palavra que diz que o assunto não tem data.",mark:["atemporal"]},why:"Cartum: humor crítico atemporal, em quadro único, entendido sem contexto."}),bn({id:"lin-gen-charge-f3",alvo:"charge",oculta:"fato",certa:"Fato do dia",errados:["Tema geral","Slogan","Lide"],lvl:3,text:"Que parte da charge liga o desenho a um acontecimento do momento?",mark:["desenho"],hint:"Pense no que o leitor precisa conhecer para entender a piada.",why:"A charge depende de um fato do dia; o cartum tem tema geral, sem data."}),ne({id:"lin-gen-institucional-f1",alvo:"institucional",para:"def",lvl:3,wrongs:["anuncio","cartaaberta","editorial"],hl:["inst","slogan"],mark:["inst"],hint:"Veja quem assina a peça, no canto inferior.",why:"Propaganda institucional promove a imagem e as ações de quem assina, não um produto."}),Zi({id:"lin-gen-resenha-c",alvo:"resenha",lvl:3,confunde:["resumo","artigo","reportagem"],hint:{t:"Compare com o resumo: a resenha faz mais um passo."},why:"Resenha resume e avalia; o resumo só condensa, sem julgar.",src:"como no ENEM 2016 (resenha: função social)"}),ne({id:"lin-gen-cartaleitor-f1",alvo:"cartaleitor",para:"def",lvl:3,wrongs:["cartaaberta","editorial","resenha"],hl:["ref"],mark:["ref"],hint:"Veja o que o leitor cita logo no começo.",why:"Carta do leitor é curta e responde a uma matéria já publicada no veículo."}),Zi({id:"lin-gen-reportagem-c",alvo:"reportagem",lvl:3,confunde:["noticia","editorial","resenha"],hint:{t:"Procure o que ela faz a mais que a notícia."},why:"Reportagem vai além do fato: detalha causas e efeitos, e é mais longa."})],bv=[3];var Tc={};Be(Tc,{FIGS:()=>$v,PATTERNS_USED:()=>Cv,QUESTIONS:()=>xv});var Ce="Toda Matéria, Figuras de linguagem: https://www.todamateria.com.br/figuras-de-linguagem/",Oe="PreparaEnem, Figuras de linguagem no Enem: https://www.preparaenem.com/enem/figuras-de-linguagem-no-enem.htm",qe="https://pt.wikisource.org/wiki/";function Ae(o){let{ok:e,alts:a,an:t,...i}=o;return{subj:"linguagens",pat:1,enem:!0,...i,alts:a.map(r=>({t:r})),correct:[e],analise:t.map((r,n)=>`${"ABCD"[n]}) ${r}`)}}var xv=[Ae({id:"lin-enem-fig-ironia-joalheiros",lvl:2,ok:2,text:"No trecho, dizer que os joalheiros são 'muito vistos na gramática' produz o efeito de…",base:{texto:"Cuido haver dito, no capítulo XIV, que Marcela morria de amores pelo Xavier. Não morria, vivia. Viver não é a mesma coisa que morrer; assim o afirmam todos os joalheiros deste mundo, gente muito vista na gramática. Bons joalheiros, que seria do amor se não fossem os vossos dixes e fiados? Um terço ou um quinto do universal comércio dos corações.",fonte:"Machado de Assis, Memórias Póstumas de Brás Cubas (1881), cap. XVI"},alts:["Crítica à ignorância dos joalheiros, que errariam a gramática","Elogio sincero à cultura dos comerciantes da época do narrador","Finge elogiar os joalheiros para sugerir que o amor se compra com joias","Lamento pela morte de Marcela, que não resistiu ao amor"],an:["Errada. O texto não fala de erros de gramática; a 'gramática' é pretexto para o gracejo sobre 'viver' e 'morrer'.","Errada. O elogio não é sincero; 'dixes e fiados' e 'comércio dos corações' mostram que há zombaria.","Certa. O narrador diz o contrário do que pensa: os joalheiros só 'sabem' do amor que se compra. É ironia.","Errada. O narrador corrige 'morria de amores' para 'vivia'; ninguém morre nem é lamentado no trecho."],hint:{t:"Pergunte-se se o narrador diz isso a sério. Veja de que o texto fala logo depois: dixes, fiados, comércio.",trecho:"gente muito vista na gramática"},destaque:"gente muito vista na gramática",why:"Ironia: o narrador diz o contrário do que pensa para criticar. O 'saber' dos joalheiros é só o do comércio do amor.",src:"no estilo do ENEM",ref:`${Ce}. Texto-base conferido em ${qe}Memórias_Póstumas_de_Brás_Cubas/XVI (Domínio Público). ${Oe}.`}),Ae({id:"lin-enem-fig-metafora-pantera",lvl:2,ok:0,text:"Chamar a Ingratidão de 'pantera' produz, no poema, o efeito de…",base:{texto:`Somente a Ingratidão — esta pantera —
Foi tua companheira inseparável!
Acostuma-te à lama que te espera!
O Homem, que, nesta terra miserável,
Mora entre feras, sente inevitável
Necessidade de também ser fera.`,fonte:"Augusto dos Anjos, Versos íntimos, in Eu (1912)"},alts:["Apresentar a ingratidão como fera cruel que acompanha o sujeito sem trégua","Mostrar que o sujeito se sente protegido pela ingratidão, como por um guardião","Sugerir que a ingratidão é veloz e elegante, qualidades que o sujeito admira","Indicar que a ingratidão ataca só os fracos, poupando quem aceita a lama"],an:["Certa. A ingratidão É uma pantera (sem 'como'): fera que persegue, o que combina com 'lama', 'feras' e 'ser fera'.","Errada. 'Companheira inseparável' é amarga: a presença da fera é castigo, não proteção.","Errada. O poema não elogia o animal; a imagem é de ameaça, não de elegância.","Errada. Extrapola: o texto não diz que a ingratidão poupa alguém; 'acostuma-te à lama' é conselho de endurecer-se."],hint:{t:"Olhe o que é igualado a quê, e que outras palavras do trecho pertencem ao mundo dos bichos.",trecho:"a Ingratidão — esta pantera —"},destaque:"a Ingratidão — esta pantera —",why:"Metáfora: iguala um sentimento a uma fera sem 'como'. A ingratidão aparece como ameaça cruel que persegue o sujeito.",src:"no estilo do ENEM",ref:`${Ce}. Texto-base conferido em ${qe}Eu_(Augusto_dos_Anjos,_1912)/Versos_intimos (Domínio Público). ${Oe}.`}),Ae({id:"lin-enem-fig-comparacao-floresta",lvl:2,ok:3,text:"A comparação com a floresta sugere que o coração da mulher amada era…",base:{texto:`Como a floresta secular, sombria,
Virgem do passo humano e do machado,
Onde apenas, horrendo, ecoa o brado
Do tigre, e cuja agreste ramaria
Não atravessa nunca a luz do dia,
Assim também, da luz do amor privado,
Tinhas o coração ermo e fechado,
Como a floresta secular, sombria...`,fonte:"Olavo Bilac, Via Láctea, IV, in Poesias (1888)"},alts:["Coração exuberante e acolhedor, cheio de vida como uma mata em festa","Coração antigo e respeitável, valorizado pela idade como árvore secular","Coração perigoso, que guarda feras e ameaça quem dele se aproximar","Coração fechado e sem luz, isolado como mata que ninguém atravessa"],an:["Errada. A mata descrita é sombria e sem passos humanos; nada nela é festa ou acolhimento.","Errada. 'Secular' descreve a mata, mas a comparação trata de solidão e escuridão, não de respeito pela idade.","Errada. O 'tigre' compõe o cenário da mata; o texto não diz que o coração ameaça quem se aproxima (extrapolação).","Certa. 'Assim também' liga a mata sem luz e sem passo humano ao coração 'ermo e fechado', privado da luz do amor."],hint:{t:"Procure o conectivo que liga os dois termos. Depois liste o que a floresta é (luz, passos, sons) e transfira ao coração.",trecho:"Assim também"},destaque:"Assim também",why:"Comparação ('como… assim também'): o coração é tão fechado e sem luz quanto a mata virgem e sombria.",src:"no estilo do ENEM",ref:`${Ce}. Texto-base conferido em ${qe}Via_Láctea (Domínio Público). No 7º verso a Wikisource traz 'ermo o fechado', erro de transcrição; corrigido para 'ermo e fechado'. ${Oe}.`}),Ae({id:"lin-enem-fig-hiperbole-quaresma",lvl:2,ok:1,text:"Ao comparar a chegada do major a um eclipse, o narrador produz o efeito de…",base:{texto:"Não gastava nesses passos nem mesmo uma hora, de forma que, às três e quarenta, por aí assim, tomava o bonde, sem erro de um minuto, ia pisar a soleira da porta de sua casa, numa rua afastada de São Januário, bem exatamente às quatro e quinze, como se fosse a aparição de um astro, um eclipse, enfim um fenômeno matematicamente determinado, previsto e predito.",fonte:"Lima Barreto, Triste Fim de Policarpo Quaresma (1915), cap. I"},alts:["Valorizar o conhecimento de astronomia do major, comparável ao de um cientista","Sugerir, em tom de gozação, uma rotina tão rígida que parece fenômeno natural","Indicar que o major dominava os astros e determinava o horário do bonde","Criticar o bonde, tão pontual que desorganizava a rotina da vizinhança"],an:["Errada. O tom é de gozação; o texto não valoriza ciência nenhuma, brinca com a mania de horário do major.","Certa. Chegar em casa é tratado como evento astronômico 'previsto e predito': exagero proposital que faz rir da rotina.","Errada. O eclipse é só termo de exagero; ninguém atribui poderes ao major (extrapolação).","Errada. O bonde é pontual, 'sem erro de um minuto', mas não há crítica a ele nem desorganização da vizinhança."],hint:{t:"Compare a dimensão do fato (chegar em casa) com a dimensão da imagem escolhida para descrevê-lo. O tom é sério ou de gozação?",trecho:"a aparição de um astro, um eclipse"},destaque:"a aparição de um astro, um eclipse",why:"Hipérbole: tratar a chegada em casa como fenômeno astronômico exagera de propósito e ridiculariza a rotina rígida do major.",src:"no estilo do ENEM",ref:`${Ce}. Texto-base conferido em ${qe}Triste_Fim_de_Policarpo_Quaresma/I/I (Domínio Público). ${Oe}.`}),Ae({id:"lin-enem-fig-personificacao-cortico",lvl:2,ok:2,text:"No trecho, o verbo 'acordava', aplicado ao cortiço, produz o efeito de…",base:{texto:`Eram cinco horas da manhã e o cortiço acordava, abrindo, não os olhos, mas a sua infinidade de portas e janelas alinhadas.
Um acordar alegre e farto de quem dormiu de uma assentada sete horas de chumbo.`,fonte:"Aluísio Azevedo, O Cortiço (1890), cap. III"},alts:["Mostrar o cortiço vazio e silencioso de manhã, como se ainda dormisse","Destacar a quantidade enorme de moradias para impressionar o leitor","Fazer do conjunto de casas um ser vivo e coletivo que desperta","Suavizar a miséria do lugar, que passa a parecer acolhedor e calmo"],an:["Errada. O despertar é 'alegre e farto'; o texto descreve movimento, não vazio nem silêncio.","Errada. 'Infinidade' é descrição, mas o recurso do trecho está no verbo e nos 'olhos', que dão vida ao conjunto de casas.","Certa. 'Acordava', 'olhos' e 'dormiu' são traços humanos: o cortiço age como um só organismo vivo.","Errada. O narrador não suaviza a miséria nesse trecho; o recurso é atribuir ações humanas a um lugar."],hint:{t:"Veja quem pratica a ação 'acordar' e se normalmente um conjunto de casas faria isso. Note também a menção aos 'olhos'.",trecho:"o cortiço acordava"},destaque:"o cortiço acordava",why:"Personificação: acordar e ter olhos são traços humanos; o cortiço vira um ser vivo e coletivo, tema do Naturalismo.",src:"no estilo do ENEM",ref:`${Ce}. Texto-base conferido em ${qe}O_Cortiço/III (Domínio Público; grafia atualizada). ${Oe}.`}),Ae({id:"lin-enem-fig-anafora-nosso",lvl:2,ok:3,text:"No trecho, a repetição de 'Nosso/Nossas/Nossos/Nossa' no início dos versos contribui para…",base:{texto:`Minha terra tem palmeiras,
Onde canta o Sabiá;
As aves, que aqui gorjeiam,
Não gorjeiam como lá.
Nosso céu tem mais estrelas,
Nossas várzeas têm mais flores,
Nossos bosques têm mais vida,
Nossa vida mais amores.`,fonte:"Gonçalves Dias, Canção do Exílio, in Primeiros Cantos (1846)"},alts:["Mostrar a ligação do eu lírico com a terra onde está agora","Marcar a rima entre os versos e dar musicalidade, sem relação com o tema","Contrapor o grupo do eu lírico a outro grupo de moradores","Reforçar, em ritmo marcado, o orgulho e a posse afetiva da terra natal"],an:["Errada. O eu lírico está longe ('aqui' × 'lá'); a ligação é com a terra que deixou, não com a de agora.","Errada. A repetição está no começo dos versos, não na rima, e reforça o sentido: enumera o que a pátria tem de melhor.","Errada. 'Nosso' fala da terra natal; não há outro grupo de moradores sendo contraposto no trecho.","Certa. A anáfora de 'nosso' abre cada verso da enumeração das vantagens da pátria e marca a identificação com ela."],hint:{t:"Observe a posição da palavra repetida em cada verso e o que vem depois dela. O que o conjunto desses versos enumera?",trecho:`Nosso céu tem mais estrelas,
Nossas várzeas têm mais flores,
Nossos bosques têm mais vida,
Nossa vida mais amores.`},destaque:`Nosso céu tem mais estrelas,
Nossas várzeas têm mais flores,
Nossos bosques têm mais vida,
Nossa vida mais amores.`,why:"Anáfora: repetir 'nosso' no início dos versos enumera as qualidades da pátria e reforça orgulho e saudade do eu lírico.",src:"no estilo do ENEM",ref:`${Ce}. Texto-base conferido em ${qe}Canção_do_Exílio_(Gonçalves_Dias) (Domínio Público; grafia atualizada). ${Oe}.`}),Ae({id:"lin-enem-fig-refrao-morresse",lvl:2,ok:2,text:"A repetição de 'Se eu morresse amanhã' ao final das estrofes contribui para…",base:{texto:`Se eu morresse amanhã, viria ao menos
Fechar meus olhos minha triste irmã;
Minha mãe de saudades morreria,
Se eu morresse amanhã!
Quanta glória presinto em meu futuro!
Que aurora de porvir e que manhã
Eu perdera chorando essas coroas,
Se eu morresse amanhã!`,fonte:"Álvares de Azevedo, Se eu morresse amanhã (Obras, 1862)"},alts:["Mostrar tranquilidade diante da morte, que o eu lírico aceita sem medo nem pesar","Dar leveza ao poema, tratando a morte como brincadeira do eu lírico","Fixar a ideia obsessiva da morte precoce, que interromperia afetos e sonhos","Indicar que o eu lírico despreza a glória e a família que deixaria"],an:["Errada. É uma hipótese carregada de angústia ('mãe de saudades morreria'); não há serenidade nem aceitação.","Errada. Nada no trecho é cômico; a morte aparece como perda de mãe, irmã e futuro.","Certa. O verso-refrão volta ao fim de cada estrofe como pensamento fixo e fecha cada perda possível com a mesma ideia.","Errada. O eu lírico lamenta perder a glória ('perdera chorando essas coroas'); não a despreza."],hint:{t:"Veja onde o mesmo verso reaparece e o que vem imediatamente antes dele em cada estrofe.",trecho:"Se eu morresse amanhã!"},destaque:"Se eu morresse amanhã!",why:"Repetição em refrão no fim das estrofes: toda perda imaginada termina na mesma hipótese e dá ao poema um tom obsessivo.",src:"no estilo do ENEM",ref:`${Ce}. Texto-base conferido em ${qe}Se_eu_morresse_amanhã (Domínio Público; grafia atualizada). ${Oe}.`}),Ae({id:"lin-enem-fig-metonimia-armas",lvl:3,ok:0,text:"No primeiro verso, a palavra 'armas' é usada de modo a…",base:{texto:`As armas e os barões assinalados,
Que da ocidental praia Lusitana,
Por mares nunca de antes navegados,
Passaram ainda além da Taprobana,
Em perigos e guerras esforçados,
Mais do que prometia a força humana,
E entre gente remota edificaram
Novo Reino, que tanto sublimaram;`,fonte:"Luís Vaz de Camões, Os Lusíadas (1572), Canto I, estrofe 1"},alts:["Pôr o objeto no lugar da atividade, resumindo os feitos de guerra em imagem concreta","Informar, ao pé da letra, que as naus partiram carregadas apenas de armamentos para a viagem","Comparar os portugueses a armas, destacando a dureza e a frieza dos navegantes","Exagerar o poderio militar de Portugal para ironizar a conquista dos mares"],an:["Certa. 'Armas' (o objeto) está no lugar da vida militar e dos feitos de guerra; o par 'armas e barões' resume os heróis do poema.","Errada. Leitura literal: o verso anuncia façanhas, e não a carga das naus.","Errada. Não há comparação: 'armas' não é aproximada dos navegantes, apenas representa as guerras que enfrentaram.","Errada. O tom da abertura é épico e elogioso; não há ironia nem exagero zombeteiro."],hint:{t:"O que o poema anuncia que vai cantar? Que palavra aparece no lugar disso?",trecho:"As armas e os barões assinalados"},destaque:"As armas e os barões assinalados",why:"Metonímia: o objeto (armas) está no lugar da atividade (guerra, feitos militares); alguns manuais falam em sinédoque.",src:"no estilo do ENEM",ref:`${Ce}. Texto-base conferido em ${qe}Os_Lusíadas_(grafia_atualizada)/I (Domínio Público). ${Oe}.`}),Ae({id:"lin-enem-fig-antitese-bahia",lvl:3,ok:3,text:"Nesses versos, a oposição entre 'pobre' e 'rica' produz o efeito de…",base:{texto:`Triste Bahia! Oh quão dessemelhante
Estás, e estou do nosso antigo estado!
Pobre te vejo a ti, tu a mi empenhado,
Rica te vejo eu já, tu a mi abundante.
A ti tocou-te a máquina mercante,
Que em tua larga barra tem entrado,
A mim foi-me trocando, e tem trocado
Tanto negócio, e tanto negociante.`,fonte:"Gregório de Matos, Triste Bahia! Oh quão dessemelhante (séc. XVII)"},alts:["Mostrar que a Bahia é, ao mesmo tempo, rica e pobre, numa contradição sem solução","Exagerar a miséria da cidade para provocar riso no leitor e criticar o povo","Atenuar a decadência da Bahia, apresentada como passageira e sem importância","Contrapor riqueza e pobreza de antes e de agora para lamentar a decadência"],an:["Errada. Pobre e rica não valem para o mesmo momento: o poeta compara dois tempos (o 'antigo estado' e o agora).","Errada. O tom é de queixa e tristeza ('Triste Bahia!'), sem riso nem exagero cômico.","Errada. Não há atenuação: o poeta lamenta a mudança e culpa a 'máquina mercante' e os negociantes.","Certa. Palavras de sentido oposto (pobre × rica, empenhado × abundante) contrastam o antes e o agora e sustentam o lamento."],hint:{t:"Observe os adjetivos postos lado a lado e o tempo a que cada um se refere ('antigo estado', 'já').",trecho:`Pobre te vejo a ti, tu a mi empenhado,
Rica te vejo eu já, tu a mi abundante.`},destaque:`Pobre te vejo a ti, tu a mi empenhado,
Rica te vejo eu já, tu a mi abundante.`,why:"Antítese: termos opostos (pobre × rica) contrastam o passado e o presente e sustentam o lamento pela decadência.",src:"no estilo do ENEM",ref:`${Ce}. Texto-base conferido em ${qe}Triste_Bahia!_Oh_quão_dessemelhante (Domínio Público). ${Oe}.`}),Ae({id:"lin-enem-fig-paradoxo-amor",lvl:3,ok:2,text:"Na definição do amor, a expressão 'contentamento descontente' produz o efeito de…",base:{texto:`Amor é fogo que arde sem se ver;
É ferida que dói e não se sente;
É um contentamento descontente;
É dor que desatina sem doer;`,fonte:"Luís Vaz de Camões, Amor é fogo que arde sem se ver (séc. XVI)"},alts:["Mostrar que o amor é motivo de pura alegria, sem sofrimento algum","Ironizar quem diz estar contente, pois o amor só traz tédio","Mostrar que o amor reúne sensações opostas e só se explica pela contradição","Listar sentimentos diferentes em ordem crescente, do mais fraco ao mais forte"],an:["Errada. Os versos falam de fogo, ferida e dor; o amor ali é sofrimento e prazer juntos, não alegria pura.","Errada. Não há zombaria de ninguém; o poeta define o amor, e não o tédio.","Certa. 'Contentamento descontente' une ideias que se negam, como 'dor sem doer': paradoxo que traduz o amor contraditório.","Errada. Os versos não formam escala de intensidade; cada um é uma definição à parte, de sentido contraditório."],hint:{t:"Releia a expressão e pergunte-se se as duas palavras combinam ou se chocam. Depois compare com 'dor que desatina sem doer'.",trecho:"contentamento descontente"},destaque:"contentamento descontente",why:"Paradoxo: ideias que se contradizem ('contentamento descontente', 'dor sem doer') expressam um amor feito de opostos.",src:"no estilo do ENEM",ref:`${Ce}. Texto-base conferido em ${qe}Amor_he_hum_fogo_que_arde_sem_se_ver (Domínio Público; grafia atualizada). ${Oe}.`}),Ae({id:"lin-enem-fig-sinestesia-harmonia",lvl:3,ok:1,text:"No trecho, a expressão 'doce harmonia' contribui para…",base:{texto:`Oh! que doce harmonia traz-me a brisa!
Que música suave ao longe soa!
Meu Deus! como é sublime um canto ardente
Pelas vagas sem fim boiando à toa!`,fonte:"Castro Alves, O Navio Negreiro (1869), parte I"},alts:["Marcar o contraste entre a doçura da música e a dureza do mar revolto","Fazer a música da brisa parecer tão agradável que quase se saboreia","Mostrar que a brisa canta como uma pessoa para o poeta, que a escuta","Comparar a música ao sabor de um doce, por meio de um conectivo"],an:["Errada. 'Doce' e 'música suave' combinam; o trecho fala de encanto, e não de choque com um mar revolto.","Certa. 'Doce' (paladar) qualifica 'harmonia' (audição): sinestesia que torna a música trazida pela brisa deliciosa.","Errada. A brisa 'traz' o som, mas ela não canta nem age como pessoa; o recurso está na mistura de sentidos.","Errada. Não há comparação: o único 'como' do trecho, no 3º verso, introduz uma exclamação ('como é sublime')."],hint:{t:"Procure adjetivos que normalmente pertencem a um sentido (gosto, tato) mas qualificam algo de outro (o som).",trecho:"doce harmonia"},destaque:"doce harmonia",why:"Sinestesia: 'doce' (paladar) com 'harmonia' (audição) dá à música trazida pela brisa um encanto sensorial intenso.",src:"no estilo do ENEM",ref:`${Ce}. Texto-base conferido em ${qe}O_Navio_Negreiro (Domínio Público). ${Oe}.`}),Ae({id:"lin-enem-fig-aliteracao-sussurro",lvl:3,ok:0,text:"No trecho, a repetição de certos sons consonantais contribui para…",base:{texto:`E sons soturnos, suspiradas mágoas,
Mágoas amargas e melancolias,
No sussurro monótono das águas,
Noturnamente, entre ramagens frias.`,fonte:"Cruz e Sousa, Violões que choram, in Faróis (1900)"},alts:["Sugerir, pelo som, o sussurro das águas e o clima de lamento da noite","Marcar a violência da noite, com sons ásperos e secos que lembram golpes de faca","Dar ritmo de festa aos versos, com sons vivos que lembram dança","Mostrar o silêncio total da noite, sem qualquer som vindo das águas"],an:["Certa. A aliteração do /s/ (sons, soturnos, suspiradas, sussurro) imita o sussurro e reforça o clima de mágoa e melancolia.","Errada. Os sons repetidos são suaves, e as palavras falam de suspiro e melancolia, não de violência.","Errada. O tom é de lamento ('mágoas amargas'), sem qualquer ideia de festa ou dança.","Errada. Há som: o 'sussurro monótono das águas'; o texto não descreve silêncio total."],hint:{t:"Leia os versos em voz alta e note o som que mais se repete. Depois ligue esse som à palavra 'sussurro'.",trecho:"No sussurro monótono das águas"},destaque:"No sussurro monótono das águas",why:"Aliteração: o /s/ repetido imita o sussurro das águas e acompanha o lamento do poema; o som reforça o sentido.",src:"no estilo do ENEM",ref:`${Ce}. Texto-base conferido em ${qe}Violões_Que_Choram... (Domínio Público; grafia atualizada). ${Oe}.`}),Ae({id:"lin-enem-fig-gradacao-vulto",lvl:3,ok:3,text:"A sequência de verbos 'Tropeça, cai, soluça, arqueja, grita' produz o efeito de…",base:{texto:`Hoje, quero, em teus braços acolhido,
Rever a estrada pavorosa e escura
Onde, ladeando o abismo da loucura,
Andei de pesadelos perseguido.
Olha-a: torce-se toda na infinita
Volta dos sete círculos do inferno...
E nota aquele vulto: as mãos eleva,
Tropeça, cai, soluça, arqueja, grita,
Buscando um coração que foge, e eterno
Ouvindo-o perto palpitar na treva.`,fonte:"Olavo Bilac, Via Láctea, II, in Poesias (1888)"},alts:["Mostrar a calma do vulto, que caminha sem pressa e sem dor pela estrada escura","Repetir a mesma ideia de queda para fixá-la na memória do leitor","Opor movimentos de queda a gestos de descanso do vulto na estrada","Acumular ações que vão intensificando o sofrimento do vulto até o grito"],an:["Errada. Os verbos (tropeça, cai, soluça, arqueja) mostram aflição, e não calma.","Errada. Cada verbo traz uma ação diferente; a sequência avança, e não repete a ideia de queda.","Errada. Nenhum verbo expressa descanso; todos descrevem dor e esforço.","Certa. Os verbos vão do tropeço ao grito, em escala crescente de sofrimento: gradação."],hint:{t:"Compare a força de cada verbo da sequência, na ordem em que aparecem. Em que ponto a dor se torna som?",trecho:"Tropeça, cai, soluça, arqueja, grita,"},destaque:"Tropeça, cai, soluça, arqueja, grita,",why:"Gradação: dos verbos mais leves (tropeça) ao grito, a sequência intensifica o sofrimento do vulto passo a passo.",src:"no estilo do ENEM",ref:`${Ce}. Texto-base conferido em ${qe}Via_Láctea (Domínio Público). ${Oe}.`})],$v={},Cv=[1];var Lc={};Be(Lc,{FIGS:()=>Av,PATTERNS_USED:()=>wv,QUESTIONS:()=>qv});var xa="Toda Matéria, Funções da linguagem: https://www.todamateria.com.br/funcoes-da-linguagem/",Ov=(o,e)=>`${o}: ${e}`,ar=o=>`Texto elaborado para o jogo, no formato de ${o}`,Ke=o=>({id:"lin-enem-fun-"+o.id,subj:"linguagens",pat:2,lvl:o.lvl,enem:!0,text:o.text,base:o.base,fig:[],alts:o.alts.map(e=>({t:e})),correct:[o.c],analise:o.analise,hint:{t:o.hint,trecho:o.trecho},destaque:o.destaque,why:o.why,src:o.src||"no estilo do ENEM",ref:o.ref}),qv=[Ke({id:"noticia-ciclovia",lvl:2,text:"A função predominante se evidencia pelo(a)…",base:{titulo:"Prefeitura inaugura ciclovia",fonte:ar("notícia"),texto:"A nova ciclovia, de 12 km, liga o terminal de ônibus ao parque central e custou R$ 8 milhões, segundo a Secretaria de Obras. De acordo com a prefeitura, a pista deve receber cerca de 3 mil ciclistas por dia. A abertura ao público ocorre neste sábado, às 8h."},alts:["convite direto ao leitor para que use a ciclovia na data da abertura","apresentação de medidas, custo e horário, em 3ª pessoa e com fontes citadas","tom de entusiasmo do jornalista, que valoriza a obra com adjetivos elogiosos","linguagem figurada que embeleza a notícia e chama atenção para a forma"],c:1,analise:["Errada: o texto só informa a data; não há imperativo nem vocativo que convoque o leitor (conativa).","Certa: medidas, valores e horário em 3ª pessoa, citando fontes, informam sobre o assunto (referencial).","Errada: não há 1ª pessoa, exclamação nem adjetivo avaliativo; a emotiva está ausente.","Errada: a linguagem é denotativa e direta; não há figuras que valorizem a forma (poética)."],hint:"Veja de quem o texto fala: do emissor, do leitor ou do assunto?",trecho:"segundo a Secretaria de Obras",destaque:"custou R$ 8 milhões",why:"Referencial: foco no assunto, com dados, fontes e 3ª pessoa. Não há apelo, emoção ou jogo com a forma.",src:"como no ENEM 2018 (texto sobre aplicativo: função referencial em linguagem denotativa)",ref:xa+" | Notícia original, sem texto de terceiros."}),Ke({id:"meus-oito-anos",lvl:2,text:"Como o foco é o sentimento de quem fala, a função predominante se evidencia pelo(a)…",base:{titulo:"Meus oito anos",fonte:"Casimiro de Abreu, As primaveras (1859), ortografia atualizada",texto:`Oh! que saudades que tenho
Da aurora da minha vida,
Da minha infância querida
Que os anos não trazem mais!`},alts:["relato neutro de fatos da infância, sem marcas de opinião ou de emoção","uso das rimas e da imagem “aurora da vida”, sem relação com o que o eu sente","exclamação e verbos em 1ª pessoa que revelam a saudade do eu lírico","uso do imperativo para pedir que o leitor também lembre a sua infância"],c:2,analise:["Errada: o tom é afetivo e pessoal; nada é descrito de forma neutra e impessoal (referencial).","Errada: rimas e metáfora existem e são traço secundário (poética), mas o enunciado pede o que revela o sentimento de quem fala.","Certa: “Oh!”, “tenho” e “minha” centram o texto no emissor, que expõe a saudade (emotiva). A poética é secundária.","Errada: não há imperativo nem vocativo; o leitor não é chamado a agir (conativa)."],hint:"Procure quem aparece no texto: o eu, o leitor ou um assunto externo?",trecho:"Oh! que saudades que tenho",destaque:"Oh! que saudades que tenho",why:"Emotiva: o foco é o sentimento do eu lírico (1ª pessoa, exclamação). A forma poética existe, mas é secundária.",ref:Ov("Conceito","https://www.todamateria.com.br/funcoes-da-linguagem/")+" | Texto conferido em https://pt.wikisource.org/wiki/Meus_oito_anos"}),Ke({id:"anuncio-colchao",lvl:2,text:"A função predominante do anúncio se evidencia pelo(a)…",base:{titulo:"Seu sono merece mais",fonte:ar("anúncio publicitário"),texto:"Troque o colchão antes que a dor nas costas escolha por você. Visite a Colchões Luar do Sul, aproveite 30% de desconto até domingo e acorde outra pessoa."},alts:["preço e desconto expostos de modo imparcial, sem tentar convencer ninguém","desabafo do emissor sobre as próprias noites mal dormidas, em 1ª pessoa","verbos no imperativo e “seu”, dirigidos ao consumidor para levá-lo a comprar","jogo de sons e imagens que faz do título um verso e valoriza a forma"],c:2,analise:["Errada: o desconto é argumento de venda, não dado neutro (referencial é traço secundário).","Errada: não há 1ª pessoa nem confissão de sentimentos de quem anuncia (emotiva).","Certa: “troque”, “visite”, “aproveite” e “acorde” miram o receptor para convencê-lo (conativa).","Errada: o título tem ritmo, mas serve à venda; a forma não é o foco (poética secundária)."],hint:"Observe a forma dos verbos e a quem eles se dirigem.",trecho:"Troque o colchão",destaque:"Visite a Colchões Luar do Sul",why:"Conativa: foco no receptor, com imperativos que o levam a agir (trocar, visitar, aproveitar).",ref:xa+" | Anúncio original, sem texto de terceiros."}),Ke({id:"app-audio",lvl:2,text:"A função predominante se evidencia pelo(a)…",base:{titulo:"Conversa por chamada de voz",fonte:ar("conversa de aplicativo de mensagens"),texto:`— Oi, tá aí?
— Tô! Tá me ouvindo? Seu áudio tá picotando.
— E agora?
— Agora foi. Pode falar, tô te ouvindo.`},alts:["descrição precisa do defeito do áudio, com dados sobre a falha técnica","troca de falas que verificam e confirmam se o canal está funcionando","explicação de palavras e expressões usadas pelos falantes na conversa","ordens que tentam convencer o outro a mudar de atitude durante a chamada"],c:1,analise:["Errada: o problema do áudio é só pretexto; as falas não descrevem a falha com dados (referencial).","Certa: “tá aí?”, “tá me ouvindo?” e “tô te ouvindo” verificam se o contato funciona (fática).","Errada: ninguém comenta palavras nem regras da língua (metalinguística).","Errada: “pode falar” autoriza a fala, mas não visa convencer (conativa)."],hint:"Pergunte-se: há algum assunto sendo discutido ou só o contato?",trecho:"Tá me ouvindo?",destaque:"tô te ouvindo",why:"Fática: o foco é o canal. As falas abrem, testam e confirmam o contato; quase nada se informa.",ref:xa+" | Diálogo original, sem texto de terceiros."}),Ke({id:"ourives-bilac",lvl:2,text:"A função predominante do trecho se evidencia pelo(a)…",base:{titulo:"Profissão de fé (trecho)",fonte:"Olavo Bilac, Profissão de fé (Poesias, 1888)",texto:`Invejo o ourives quando escrevo:
Imito o amor
Com que ele, em ouro, o alto relevo
Faz de uma flor.`},alts:["descrição objetiva do trabalho do ourives, sem relação com a escrita","comparação entre escrever e o ofício do ourives, com o poema falando do poema","convite ao leitor para que aprenda o ofício do ourives e escreva também","confissão da inveja que o poeta sente, em tom de desabafo pessoal"],c:1,analise:["Errada: o ourives é termo de comparação; o assunto é a escrita, não a ourivesaria (referencial).","Certa: o poeta trata do próprio fazer poético, explicado pela imagem do ourives (metalinguística).","Errada: não há imperativo nem vocativo dirigidos ao leitor (conativa).","Errada: a inveja é traço de 1ª pessoa, mas serve para tratar da arte de escrever (emotiva secundária)."],hint:"Qual é o verdadeiro assunto: o ourives ou o ato de escrever?",trecho:"Imito o amor",destaque:"quando escrevo",why:"Metalinguística: o poema fala do próprio fazer poético, comparado ao trabalho do ourives.",ref:xa+" | Texto conferido em https://pt.wikisource.org/wiki/Profissão_de_Fé"}),Ke({id:"autopsicografia",lvl:3,text:"A função predominante se evidencia pelo(a)…",base:{titulo:"Autopsicografia (trecho)",fonte:"Fernando Pessoa, Autopsicografia (1932)",texto:`O poeta é um fingidor.
Finge tão completamente
Que chega a fingir que é dor
A dor que deveras sente.`},alts:["confissão de uma dor pessoal, em que o eu lírico fala de si mesmo","destaque dado a rimas e ritmo como marcas da poeticidade do texto","definição do poeta e do ato de criar, em poesia sobre a própria poesia","constatação, em tom neutro, de um fato sobre os escritores em geral"],c:2,analise:["Errada: a dor é tema da reflexão sobre o fingimento; o poeta não se confessa, ele explica a criação (emotiva).","Errada: rima e ritmo existem, mas servem à ideia; o foco do texto é o fazer poético (poética secundária).","Certa: o assunto é o poeta e a criação; a linguagem poética explica a poesia (metalinguística).","Errada: não há tom neutro nem dado verificável; a afirmação é uma tese lírica (referencial)."],hint:"Troque a pergunta “o que o poeta sente?” por “sobre o que o poema fala?”.",trecho:"O poeta é um fingidor",destaque:"O poeta é um fingidor",why:"Metalinguística: o poema tem a criação poética como assunto. Rima e dor aparecem, mas em segundo plano.",src:"como no ENEM 2021 PPL (poema que fala de si como linguagem)",ref:xa+" | Texto conferido em https://pt.wikisource.org/wiki/Autopsicografia"}),Ke({id:"violoes-cruz",lvl:3,text:"A função que privilegia a construção da mensagem se evidencia pelo(a)…",base:{titulo:"Violões que choram… (abertura)",fonte:"Cruz e Sousa, Faróis (1900)",texto:`Ah! plangentes violões dormentes, mornos,
Soluços ao luar, choros ao vento...`},alts:["interjeição “Ah!”, isolada no início, que expõe a emoção de quem fala","referência a um fato musical datado, tratado como informação objetiva","reflexão sobre o fazer poético e sobre a linguagem própria da música","repetição de sons e imagens como “soluços ao luar”, que valoriza a forma"],c:3,analise:["Errada: “Ah!” e a tristeza dos violões dão traço emotivo, mas secundário; o enunciado pede a construção da mensagem.","Errada: não há fato datado nem dado informativo; os adjetivos são figurados (referencial).","Errada: os violões são tema e imagem; o poema não fala da linguagem em si (metalinguística).","Certa: sons repetidos, ritmo e imagens (“choros ao vento”) põem a mensagem em evidência (poética)."],hint:"Compare a força de uma interjeição com a de todos os sons e imagens.",trecho:"Soluços ao luar, choros ao vento",destaque:"Soluços ao luar, choros ao vento",why:"Poética: ritmo, sonoridade e imagens valorizam a forma. O “Ah!” e o tom triste são traço emotivo secundário.",ref:xa+" | Verso conferido em https://pt.wikisource.org/wiki/Violões_que_choram..."}),Ke({id:"campanha-vacina",lvl:3,text:"A função predominante se evidencia pelo(a)…",base:{titulo:"Campanha de vacinação",fonte:ar("campanha publicitária (dados fictícios)"),texto:"Segundo especialistas, a cobertura vacinal infantil caiu e doenças já controladas podem voltar. Não espere: leve seu filho ao posto de saúde, atualize a caderneta e proteja quem você ama."},alts:["informação sobre a queda da cobertura vacinal, que abre o texto","imperativos e “você” dirigidos ao leitor, com a informação como motivo","referência afetiva a “quem você ama”, que expõe os sentimentos do emissor","citação de “especialistas”, que dá voz a uma fonte e afasta o emissor"],c:1,analise:["Errada: o dado inicial é traço secundário; serve de argumento para o apelo final (referencial).","Certa: “leve”, “atualize”, “proteja” e “você” miram o receptor, e o dado é motivo para agir (conativa).","Errada: “quem você ama” é recurso de persuasão ao leitor, não confissão do emissor (emotiva).","Errada: citar especialistas apoia a informação, mas o texto termina em ordens ao leitor (referencial)."],hint:"Descubra qual parte do texto manda o leitor fazer algo.",trecho:"leve seu filho ao posto de saúde",destaque:"atualize a caderneta",why:"Conativa: o dado inicial só justifica o apelo. Imperativos e “você” mostram o foco no receptor.",ref:xa+" | Campanha original, sem texto de terceiros."}),Ke({id:"tabacaria",lvl:3,text:"A função predominante se evidencia pelo(a)…",base:{titulo:"Tabacaria (abertura)",fonte:"Álvaro de Campos (Fernando Pessoa), Tabacaria (escrito em 1928)",texto:`Não sou nada.
Nunca serei nada.
Não posso querer ser nada.
À parte isso, tenho em mim todos os sonhos do mundo.`},alts:["constatação de fatos sobre si, como dados objetivos de um relatório","exposição, em 1ª pessoa, da visão que o sujeito tem de si e dos sonhos","repetição de “nada”, que vale mais pelo som e pela forma que pelo sentido","frases curtas em tom de ordem, que tentam convencer um interlocutor"],c:1,analise:["Errada: o tom é de constatação, mas os verbos em 1ª pessoa expressam uma vivência pessoal, não um fato verificável (referencial).","Certa: “sou”, “serei”, “posso” e “tenho” mostram o emissor revelando a si mesmo e o que sente (emotiva).","Errada: a repetição é recurso expressivo, secundário diante do foco no eu que fala (poética tomada como predominante).","Errada: as frases curtas são afirmações, não imperativos; não há interlocutor a convencer (conativa)."],hint:"Observe quem é o sujeito e o assunto dos verbos.",trecho:"tenho em mim todos os sonhos do mundo",destaque:"Não sou nada.",why:"Emotiva: o eu fala de si, em 1ª pessoa. O tom de constatação e a repetição são traços secundários.",ref:xa+" | Texto conferido em https://pt.wikisource.org/wiki/Tabacaria"}),Ke({id:"verbete-saudade",lvl:3,text:"A função predominante do texto se evidencia pelo(a)…",base:{titulo:"Verbete",fonte:ar("verbete de dicionário"),texto:"saudade s.f. 1. Sentimento de falta de alguém ou de algo distante. 2. Lembrança nostálgica de um tempo vivido. Ex.: A saudade é um pedaço de casa que a gente leva no peito."},alts:["explicação do sentido de uma palavra, com exemplo de uso","saudade pessoal de quem escreve o verbete, dita em 1ª pessoa","metáfora do exemplo, que torna o texto poético e valoriza a forma","informação sobre a história do sentimento, em tom científico"],c:0,analise:["Certa: acepções numeradas e exemplo de uso explicam a palavra “saudade” (metalinguística).","Errada: não há 1ª pessoa nem confissão; o verbete não revela sentimentos de quem o escreve (emotiva).","Errada: a metáfora do exemplo é traço secundário; o texto continua sendo definição (poética).","Errada: não se informa a história do sentimento; o texto explica o termo, não o fenômeno (referencial)."],hint:"Veja o que o texto explica: um fato do mundo ou uma palavra?",trecho:"Sentimento de falta de alguém ou de algo distante",destaque:"saudade s.f.",why:"Metalinguística: o verbete usa a língua para explicar uma palavra. A metáfora do exemplo é só um adorno.",ref:xa+" | Verbete original, sem texto de terceiros."})],Av={},wv=[2];var Rc={};Be(Rc,{FIGS:()=>kv,PATTERNS_USED:()=>yv,QUESTIONS:()=>Ev});var tr="Toda Matéria, Gêneros textuais: https://www.todamateria.com.br/generos-textuais/",we=(o,e)=>`PreparaEnem, ${o}: https://www.preparaenem.com/portugues/${e}.htm`,Ha=o=>`Texto elaborado para o jogo, no formato de ${o}`;function Ne({id:o,lvl:e,text:a,base:t,ok:i,bad:r,pos:n,hint:s,destaque:c,why:l,src:d="no estilo do ENEM",ref:m}){let p=[],f=[],u=0;for(let g=0;g<4;g++){let[h,C]=g===n?i:r[u++];p.push({t:h}),f.push(`${"ABCD"[g]}) ${g===n?"Certa":"Errada"}: ${C}`)}return{id:"lin-enem-gen-"+o,subj:"linguagens",pat:3,lvl:e,enem:!0,text:a,fig:[],base:t,alts:p,correct:[n],analise:f,hint:s,destaque:c,why:l,src:d,ref:m}}var Ev=[Ne({id:"carta-caminha",lvl:2,pos:0,text:"Os elementos que identificam o trecho como carta são…",base:{titulo:"Carta a El Rei D. Manuel (fecho)",fonte:"Pero Vaz de Caminha, Carta a El Rei D. Manuel (1500), grafia atualizada; trechos omitidos marcados com [...]",texto:`E desta maneira dou aqui a Vossa Alteza conta do que nesta Vossa terra vi. E se a um pouco alonguei, Ela me perdoe.
[...]
Beijo as mãos de Vossa Alteza.
Deste Porto Seguro, da Vossa Ilha da Vera Cruz, hoje, sexta-feira, primeiro dia de Maio de 1500.`},ok:["Despedida formal, local e data, com 1ª pessoa dirigindo-se a um destinatário certo",'despedida formal, local e data são marcas de carta; "dou conta do que vi" é relato a uma autoridade.'],bad:[["Impessoalidade e objetividade para informar um fato recente ao público em geral",'isso é notícia; aqui há um "eu" que se dirige a "Vossa Alteza".'],["Voz coletiva de um jornal que expõe sua opinião sobre um tema de interesse público","isso é editorial; não há jornal nem tese a defender no trecho."],["Pedido formal de um grupo a uma autoridade, validado por uma lista de assinaturas","isso é abaixo-assinado; aqui escreve uma só pessoa e não há lista de nomes."]],hint:{t:"Olhe como o texto termina: fórmula de despedida, local e data.",trecho:"Beijo as mãos de Vossa Alteza."},destaque:"dou aqui a Vossa Alteza conta do que nesta Vossa terra vi",why:'Despedida, local, data e "dar conta" ao rei marcam a carta de relato a uma autoridade, com 1ª pessoa e destinatário definido.',ref:`${tr} | PreparaEnem, Carta aberta (gênero carta): https://www.preparaenem.com/portugues/carta-aberta.htm | Texto-base conferido: https://pt.wikisource.org/wiki/Carta_a_El_Rei_D._Manuel_(ortografia_atualizada)`}),Ne({id:"cronica-bons-dias",lvl:2,pos:2,text:"Um traço que identifica o texto como crônica é…",base:{titulo:"Bons dias!",fonte:'Machado de Assis, "Bons dias!", Gazeta de Notícias (19/5/1888)',texto:"Eu pertenço a uma família de profetas après coup, post factum, depois do gato morto, ou como melhor nome tenha em holandês. Por isso digo juro se necessário for, que toda a história desta lei de 13 de maio estava por mim prevista, tanto que na segunda-feira, antes mesmo dos debates, tratei de alforriar um molecote que tinha, pessoa de seus dezoito anos, mais ou menos."},ok:["Narrador em 1ª pessoa comenta com ironia a lei de 13 de maio, em tom leve","a crônica parte de um fato do dia e o comenta com leveza e ironia, em voz pessoal."],bad:[["Linguagem impessoal e objetiva que informa o fato com lide, sem opinião do autor","isso é notícia; o texto é pessoal, irônico e cheio de opinião."],["Tese defendida com argumentos em nome de uma instituição que fala em coletivo","isso é editorial; aqui fala um narrador individual, não o jornal."],["Personagens e clímax de ficção, sem ligação alguma com fatos reais da época","o conto não comenta o noticiário; o texto parte de um fato real, a lei de 13 de maio."]],hint:{t:"Quem fala? E de que assunto do dia ele parte?",trecho:"toda a história desta lei de 13 de maio"},destaque:"Eu pertenço a uma família de profetas",why:"Crônica: texto curto que parte de um fato do cotidiano ou do noticiário e o comenta em 1ª pessoa, com ironia ou humor e tom leve.",ref:`${we("Crônica","cronica")} | Texto-base conferido: https://pt.wikisource.org/wiki/Cr%C3%B4nica_da_Aboli%C3%A7%C3%A3o`}),Ne({id:"cronica-ontem-hoje",lvl:3,pos:1,text:"A finalidade do texto, típica da crônica, é…",base:{titulo:"Ontem e hoje",fonte:'Lima Barreto, "Ontem e hoje", Careta (26/6/1915); trechos omitidos marcados com [...]',texto:`Certa vez a aglomeração de povo foi tal que o guarda civil de ronda compareceu, mas logo afastou-se dizendo:
— É o nosso homem.
[...]
Ninguém lhe fala, ninguém lhe pede nada, ninguém o abraça - porque?
[...]
Porque? Não sabemos, mas talvez o guarda civil pudesse dizer:
— Ele não é mais o nosso homem.`},ok:["Criticar com ironia quem só cerca o homem de poder enquanto ele tem algo a oferecer","a cena do cotidiano serve de pretexto para a crítica irônica, em tom de crônica."],bad:[["Informar de modo objetivo o público sobre a rotina e a agenda de uma figura pública","isso seria notícia; o texto não traz lide, e sim cena e ironia."],["Convencer o leitor, com tese e dados, a retirar o apoio a uma figura pública","isso seria artigo de opinião; não há tese explícita nem dados."],["Aprofundar, com entrevistas e números, as causas da perda de prestígio de alguém","isso seria reportagem; o texto só observa e sugere."]],hint:{t:"Compare as duas falas do guarda civil: o que mudou entre elas?",trecho:"É o nosso homem."},destaque:"Ele não é mais o nosso homem.",why:"A crônica usa uma cena observada e o desfecho irônico (a fala repetida do guarda) para criticar o comportamento social, sem tese formal.",ref:`${we("Crônica","cronica")} | Texto-base conferido: https://pt.wikisource.org/wiki/Ontem_e_hoje_(Lima_Barreto)`}),Ne({id:"autoral-candidatura",lvl:3,pos:3,text:"O que mostra que o texto não é um editorial, e sim de autoria pessoal?",base:{titulo:"A minha candidatura",fonte:'Lima Barreto, "A minha candidatura", Careta (18/8/1921); trechos omitidos marcados com [...]',texto:`Vou escrever um artigo perfeitamente pessoal; e é preciso. Sou candidato à Academia de Letras, na vaga do Sr. Paulo Barreto. Não há nada mais justo e justificável. [...] Eu sou escritor e, seja grande ou pequeno, tenho direito a pleitear as recompensas que o Brasil dá aos que se distinguem na sua literatura.
[...]
Eu não temo abaixo-assinados em matéria de Letras.`},ok:["Fala uma pessoa identificada, em 1ª pessoa, que defende um interesse próprio",'"Sou candidato", "eu sou escritor": a opinião é de um autor, não do veículo.'],bad:[["O autor só relata fatos de modo neutro, sem tomar posição diante do assunto","há opinião forte e defesa de uma causa própria; não é texto neutro."],["Há um lide que responde a quem, o quê, quando e onde sobre um fato novo","o lide é marca de notícia; o texto abre anunciando que será pessoal."],['A voz é a do próprio jornal, em "nós" coletivo, e o texto sai sem assinatura','o texto usa "eu" e é do autor identificado na fonte; o editorial usa voz coletiva e não é assinado.']],hint:{t:"Observe o sujeito dos verbos: quem fala, um grupo ou uma pessoa?",trecho:"Sou candidato à Academia de Letras"},destaque:"Eu sou escritor e, seja grande ou pequeno, tenho direito",why:"Autor identificado, em 1ª pessoa e com interesse próprio: autoria individual; o editorial é impessoal, coletivo e sem assinatura.",ref:`${we("Editorial","editorial")} | ${we("Artigo de opinião","artigo-opiniao")} | Texto-base conferido: https://pt.wikisource.org/wiki/A_minha_candidatura`}),Ne({id:"noticia-biblioteca",lvl:2,pos:0,text:"O gênero do texto se reconhece porque ele…",base:{titulo:"Biblioteca municipal reabre nesta segunda após reforma",fonte:Ha("notícia (nomes e dados fictícios)"),texto:"A Biblioteca Municipal de Vila Nova reabriu as portas nesta segunda-feira (3), depois de oito meses fechada para reforma. A obra, que custou R$ 1,2 milhão, ampliou o acervo e criou uma sala de estudos. O espaço funciona de segunda a sábado, das 8h às 18h, segundo a prefeitura."},ok:["Relata um fato recente e responde, logo no início, a quem, o quê, quando e onde","o primeiro parágrafo traz o lide e o texto segue impessoal e objetivo: é notícia."],bad:[["Aprofunda as causas do fechamento, com entrevistas e análise de especialistas","isso seria reportagem; aqui não há entrevistas nem análise de causas."],["Defende a tese de que a prefeitura deve investir mais em bibliotecas públicas","isso seria editorial ou artigo; o texto não opina."],["Comenta com lirismo a lembrança pessoal do autor com a antiga biblioteca","isso seria crônica; não há 1ª pessoa nem memória."]],hint:{t:"Leia a primeira frase: ela já traz as informações essenciais?",trecho:"reabriu as portas nesta segunda-feira (3)"},destaque:"A Biblioteca Municipal de Vila Nova reabriu as portas nesta segunda-feira (3)",why:"Notícia informa fato atual de modo impessoal; o lide (quem, o quê, quando, onde) abre o texto, sem opinião nem grande aprofundamento.",ref:`${we("Reportagem (compara com notícia)","reportagem")} | ${tr}`}),Ne({id:"reportagem-medicos",lvl:3,pos:2,text:"O que distingue o texto de uma simples notícia é que ele…",base:{titulo:"Por que faltam médicos no interior?",fonte:Ha("reportagem (dados e nomes fictícios)"),texto:'Em 4 de cada 10 cidades pequenas, há menos de um médico para mil moradores, segundo levantamento do conselho da categoria. "Plantão cansa e a estrada é longa", diz a clínica geral Marta Reis, que atende em três municípios. Especialistas apontam salário baixo, falta de estrutura e de moradia como causas do problema.'},ok:["Investiga as causas de um problema, com dados, depoimento e voz de especialistas","a reportagem aprofunda o tema: levantamento, depoimento e explicação das causas."],bad:[["Registra um fato isolado e recente, sem interpretar as causas nem ouvir ninguém","isso descreve a notícia; aqui o assunto é um problema contínuo e suas causas."],["Expressa a opinião oficial do jornal, sem citar fontes nem identificar autoria","isso é editorial; o texto cita fontes e não toma posição."],["Faz apelo direto ao leitor para agir, usando verbos no imperativo e slogan","isso é campanha; não há imperativos nem pedido de ação."]],hint:{t:"Conte quantas fontes diferentes aparecem e o que cada uma acrescenta.",trecho:"Especialistas apontam salário baixo"},destaque:"Especialistas apontam salário baixo, falta de estrutura e de moradia como causas do problema",why:"Reportagem aprofunda um assunto: dados, falas de pessoas e especialistas e explicação de causas; a notícia só relata o fato recente.",ref:`${we("Reportagem","reportagem")}`}),Ne({id:"editorial-calcada",lvl:3,pos:1,text:"O texto se caracteriza como editorial porque…",base:{titulo:"Calçada é lugar de gente",fonte:Ha("editorial"),texto:"Este jornal considera inaceitável que as calçadas do Centro continuem tomadas por buracos e carros estacionados. Defendemos que a prefeitura fiscalize, conserve e puna quem as ocupa. Cadeirantes, idosos e crianças merecem andar com segurança. Cidade que não cuida da calçada não cuida das pessoas."},ok:['O próprio jornal assume posição ("Este jornal", "Defendemos"), sem autor individual',"voz coletiva e impessoal sobre tema público é a marca do editorial."],bad:[["Um colunista assina e expõe sua opinião pessoal e subjetiva sobre o assunto",'seria artigo de opinião; aqui não há assinatura nem "eu".'],["Informa um fato novo de modo neutro, com lide e sem qualquer opinião sobre ele","seria notícia; o texto é todo opinativo."],["Relata um episódio cotidiano em tom leve e com humor, a partir de uma cena","seria crônica; o tom é argumentativo e sério."]],hint:{t:'Repare em quem é o sujeito de "considera" e "defendemos".',trecho:"Este jornal considera inaceitável"},destaque:"Este jornal considera inaceitável",why:'Editorial expressa a opinião do veículo: voz coletiva ("nós", "este jornal"), sem assinatura, argumentando sobre tema de interesse público.',ref:`${we("Editorial","editorial")} | ${we("Artigo de opinião","artigo-opiniao")}`}),Ne({id:"carta-aberta-posto",lvl:3,pos:3,text:'O uso de "Senhor prefeito" e de "carta pública" revela que o texto se dirige a…',base:{titulo:"Posto de saúde fechado: moradores cobram",fonte:Ha("carta aberta (nomes fictícios)"),texto:`Senhor prefeito,
Nós, moradores do bairro Boa Esperança, escrevemos para cobrar a reabertura do posto de saúde, fechado há seis meses. Sem atendimento, os idosos viajam duas horas até a cidade vizinha. Pedimos resposta em 30 dias e tornamos esta carta pública para que todos acompanhem.
Associação de Moradores`},ok:["Uma autoridade, mas quer alcançar também a opinião pública da comunidade",'o vocativo mira o prefeito; "carta pública" amplia o alcance a toda a comunidade (carta aberta).'],bad:[["Apenas um amigo próximo, em tom íntimo, para trocar notícias pessoais","seria carta pessoal; o assunto é coletivo e público."],["Consumidores que devem contratar um serviço oferecido pela prefeitura","seria anúncio; ninguém vende nada no texto."],["Leitores de um jornal que comentam uma matéria publicada anteriormente","seria carta do leitor; não há matéria citada e quem escreve é um grupo."]],hint:{t:"Há dois destinatários: um é nomeado; o outro, indicado no fim.",trecho:"tornamos esta carta pública"},destaque:"tornamos esta carta pública para que todos acompanhem",why:"Carta aberta cobra publicamente uma autoridade, em nome de um grupo, e quer ser lida por muitos; a carta do leitor comenta matéria do veículo.",ref:`${we("Carta aberta","carta-aberta")} | ${we("Carta do leitor","carta-leitor")}`}),Ne({id:"campanha-sangue",lvl:2,pos:3,text:"A finalidade do texto é…",base:{titulo:"Doe sangue. Doe vida.",fonte:Ha("campanha"),texto:`DOE SANGUE. DOE VIDA.
Uma doação leva só 30 minutos e pode ajudar até quatro pessoas. Procure o hemocentro mais próximo, leve um documento com foto e doe. Seu gesto faz falta.
Campanha Doe Vida (peça fictícia)`},ok:["Mobilizar o público para uma causa social, com slogan e verbos no imperativo",'slogan, imperativos ("procure", "leve", "doe") e apelo ao "você" pedem ação.'],bad:[["Vender um produto, destacando preço, promoção e vantagens ao consumidor","seria anúncio comercial; não há produto nem preço."],["Informar um fato recente, de modo impessoal, sobre o estoque dos hemocentros","seria notícia; o texto fala ao leitor e pede ação."],["Avaliar criticamente o trabalho dos hemocentros do país, apontando falhas","seria resenha ou crítica; não há avaliação."]],hint:{t:"Veja os verbos: o texto descreve algo ou manda o leitor fazer algo?",trecho:"Procure o hemocentro mais próximo"},destaque:"Procure o hemocentro mais próximo, leve um documento com foto e doe.",why:"Campanha de interesse social mobiliza o público: slogan, verbos no imperativo e apelo direto ao leitor, sem finalidade comercial.",src:"como no ENEM 2019 (campanha publicitária)",ref:`${tr} | Projeto Agatha, Elementos textuais e função social: https://projetoagathaedu.com.br/questoes-enem/resolucao-linguagens/elementos-textuais-e-funcao-social.php`}),Ne({id:"resenha-farol",lvl:2,pos:1,text:"O texto vai além de um simples resumo porque ele…",base:{titulo:'"O Farol Vazio" tem fotografia bela e ritmo irregular',fonte:Ha("resenha de filme (filme fictício)"),texto:'Em "O Farol Vazio", a diretora conta a história de uma faroleira que descobre um segredo familiar. O roteiro é enxuto e a fotografia valoriza o mar, mas o terceiro ato se arrasta e o final soa previsível. Vale pela atuação da protagonista, que sustenta o filme.'},ok:["Apresenta o enredo e também avalia a obra, apontando pontos fortes e fracos","resenha = descrição da obra + julgamento fundamentado."],bad:[["Apenas reproduz a trama em ordem, sem fazer qualquer julgamento sobre o filme",'isso seria resumo; o texto avalia ("se arrasta", "previsível").'],["Convence o leitor a comprar o ingresso, com imperativos, slogan e promoção","seria anúncio; o texto também critica o filme."],["Noticia a estreia do filme, com lide e números de bilheteria da semana","seria notícia; não há dados de estreia nem lide."]],hint:{t:"Procure palavras que dão nota, bem ou mal, à obra.",trecho:"mas o terceiro ato se arrasta"},destaque:"o terceiro ato se arrasta e o final soa previsível",why:"A resenha crítica descreve a obra e a avalia, com pontos positivos e negativos; o resumo só condensa o conteúdo.",ref:`${we("Resenha","resenha")} | ${tr}`}),Ne({id:"abaixo-assinado-escola",lvl:3,pos:2,text:"Um traço que identifica o gênero do texto é…",base:{titulo:"Pedido dos estudantes",fonte:Ha("abaixo-assinado (escola fictícia)"),texto:`Nós, abaixo assinados, estudantes da Escola Estadual Barão do Sul, solicitamos à Secretaria de Educação a instalação de ventiladores nas salas, que passam de 35 graus no verão. Pedimos providências até o início do próximo semestre.
Assinam:

-frase",texto:"Ela tem uma voz quente e aveludada.",destaque:["voz","quente"]}},{tipo:"pegadinha",titulo:"Catacrese: metáfora que virou nome",texto:"Pé da mesa, braço da cadeira, boca do rio: a metáfora ficou tão comum que virou o nome da peça. Não há outro nome, por isso ninguém sente a imagem.",fig:{kind:"lin-frase",texto:"O pé da mesa quebrou.",destaque:["pé"]}},{tipo:"exemplo",titulo:"Apóstrofe: chamar direto",texto:"Apóstrofe chama alguém ou algo pelo nome: “Senhor, ouvi a minha prece!”. Se a coisa chamada age como gente, a personificação vem junto.",fig:{kind:"lin-frase",texto:"Senhor, ouvi a minha prece!",destaque:["Senhor,"]}}],exercicios:Z([Qo(pi,"fig","personificacao","nome>def",1,{confunde:["apostrofe","hiperbole","comparacao"]}),Qo(pi,"fig","catacrese","def>nome",2,{confunde:["metonimia","hiperbole","pleonasmo"]}),He(pi,"fig","sinestesia","sinestesia",2),b("lin-enem-fig-personificacao-cortico"),qo(pi,"fig",["personificacao","sinestesia","catacrese","onomatopeia"],"marca",{nivel:2}),b("lin-enem-fig-sinestesia-harmonia"),Mo(pi,"fig","apostrofe","def",2)])};var fi="lin-u1-l5",Tf={id:fi,titulo:"Sons e construção da frase",temas:["figuras"],cartoes:[{tipo:"conceito",titulo:"Figuras de som",texto:"Onomatopeia imita um som (dlim-dlom). Aliteração repete consoantes; assonância repete vogais. Leia em voz baixa: o que se repete?",fig:{kind:"lin-frase",texto:"O sino fez dlim-dlom no fim da tarde.",destaque:["dlim-dlom"]}},{tipo:"conceito",titulo:"Repetições",texto:"Anáfora repete a palavra no começo dos versos. Polissíndeto repete conectivos (“e… e… e”). Pleonasmo repete a ideia: “vi com meus olhos”.",fig:{kind:"lin-frase",texto:"Não quero ouvir, não quero ver, não quero esquecer.",destaque:["Não quero","não quero"]}},{tipo:"exemplo",titulo:"Elipse e zeugma",texto:"Elipse omite o termo que se deduz: “Fui à feira. Comprei pão.” Zeugma omite o que já apareceu na frase: “Ana, o pão; Bia, o leite.”",fig:{kind:"lin-frase",texto:"Ana comprou o pão; Bia, o leite.",destaque:["Bia,"]}},{tipo:"enem",titulo:"Efeito, não só nome",texto:"Repetição raramente vale só pelo nome: o ENEM pergunta o efeito. A anáfora reforça uma ideia; a aliteração imita um som ou dá ritmo."}],exercicios:Z([b("lin-fig-onomatopeia-d2n"),b("lin-fig-aliteracao-e2n"),b("lin-fig-polissindeto-d2n"),Ao(fi,"fig","anafora","polissindeto",2,"def"),qo(fi,"fig",["onomatopeia","aliteracao","assonancia","hiperbato"],"def",{nivel:2}),Mo(fi,"fig","pleonasmo","def",2),He(fi,"fig","aliteracao","ironia",2),Mo(fi,"fig","elipse","def",2)])};var Lf={id:"lin-u2",titulo:"Gêneros textuais",descricao:"Notícia, editorial, crônica, anúncio, charge e outros: função social, estrutura e marcas de cada gênero.",temas:["generos"],desafio:Z([b("lin-gen-charge-f2"),b("lin-enem-gen-noticia-biblioteca"),b("lin-gen-reportagem-c"),b("lin-gen-charge-f3"),b("lin-enem-gen-reportagem-medicos"),b("lin-gen-institucional-f1"),b("lin-gen-cartaleitor-f1"),b("lin-enem-gen-carta-leitor-ciclovia"),b("lin-gen-resenha-c"),b("lin-enem-gen-carta-aberta-posto")])};var Sr="lin-u2-l1",Rf={id:Sr,titulo:"Notícia e reportagem",temas:["generos"],cartoes:[{tipo:"conceito",titulo:"Notícia: o fato em poucas linhas",texto:"Notícia informa um fato recente de modo objetivo. O lide, logo abaixo do título, responde: o quê, quem, quando, onde, como e por quê.",fig:{kind:"lin-gen-recorte",genero:"noticia",hl:["lide"]}},{tipo:"exemplo",titulo:"Reportagem: a história por trás",texto:"Reportagem aprofunda o assunto. É mais longa e traz falas de fontes, dados e as causas e consequências do fato.",fig:{kind:"lin-gen-recorte",genero:"reportagem",hl:["falas","dados"]}},{tipo:"analogia",titulo:"Foto × álbum",texto:"A notícia é a foto do acontecimento: responde “o que houve?”. A reportagem é o álbum: mostra por que aconteceu e o que muda depois."},{tipo:"pegadinha",titulo:"As duas são impessoais",texto:"Ambas informam, em 3ª pessoa. O que decide é a profundidade: curta e só o fato, é notícia; longa, com falas e dados, é reportagem."}],exercicios:Z([b("lin-gen-noticia-c"),b("lin-gen-noticia-f2"),di(Sr,"noticia","noticia",1),mi(Sr,"noticia",1),b("lin-gen-reportagem-f1"),Ao(Sr,"gen","noticia","reportagem",2,"def"),Mo(Sr,"gen","reportagem","def",2)])};var cs="lin-u2-l2",Gf={id:cs,titulo:"Editorial e artigo de opinião",temas:["generos"],cartoes:[{tipo:"conceito",titulo:"Editorial: a voz do jornal",texto:"Editorial expressa a opinião do próprio veículo. Não é assinado e usa voz coletiva (“nós”, “este jornal”) para argumentar sobre tema público.",fig:{kind:"lin-gen-recorte",genero:"editorial",hl:["assin"]}},{tipo:"conceito",titulo:"Artigo: a voz de um autor",texto:"Artigo de opinião defende o ponto de vista de uma pessoa, que assina o texto. Tem tese, argumentos e conclusão, e aceita a 1ª pessoa.",fig:{kind:"lin-gen-recorte",genero:"artigo",hl:["assin"]}},{tipo:"pegadinha",titulo:"A assinatura decide",texto:"Os dois argumentam. Sem assinatura e com voz coletiva: editorial. Autor identificado e opinião pessoal: artigo de opinião."},{tipo:"enem",titulo:"Como cai no ENEM",texto:"A pergunta costuma ser: quem fala, o veículo ou uma pessoa? Procure “nós”, “este jornal” (editorial) ou marcas de autoria e interesse próprio (artigo)."}],exercicios:Z([b("lin-gen-editorial-c"),Qo(cs,"gen","editorial","def>nome",2),b("lin-enem-gen-editorial-calcada"),b("lin-gen-artigo-f3"),qo(cs,"gen",["editorial","artigo","noticia","reportagem"],"def",{nivel:2}),b("lin-enem-gen-autoral-candidatura"),di(cs,"artigo","artigo",2)])};var ls="lin-u2-l3",Df={id:ls,titulo:"Crônica, conto e poema",temas:["generos"],cartoes:[{tipo:"conceito",titulo:"Crônica: o cotidiano comentado",texto:"Crônica parte de uma cena do dia a dia ou do noticiário e a comenta, com humor ou lirismo. É curta, de tom leve e linguagem próxima da fala.",fig:{kind:"lin-gen-recorte",genero:"cronica",hl:["cena","coment"]}},{tipo:"conceito",titulo:"Conto: história curta inventada",texto:"Conto narra uma ficção curta: poucos personagens, um conflito que cresce até o clímax e termina no desfecho.",fig:{kind:"lin-gen-recorte",genero:"conto",hl:["conflito","climax","desfecho"]}},{tipo:"exemplo",titulo:"Poema: versos e estrofes",texto:"Poema expressa emoções ou ideias em versos agrupados em estrofes, com ritmo, rima (às vezes) e muitas figuras de linguagem.",fig:{kind:"lin-gen-recorte",genero:"poema",hl:["e1","e2"]}},{tipo:"pegadinha",titulo:"Crônica × conto",texto:"Ambas são curtas, mas a crônica comenta a vida real, quase sem enredo. O conto inventa uma história com conflito, clímax e desfecho."}],exercicios:Z([b("lin-gen-cronica-d"),b("lin-gen-poema-f1"),b("lin-gen-cronica-f3"),b("lin-gen-conto-f1"),mi(ls,"conto",2),Ao(ls,"gen","cronica","conto",2,"def"),Mo(ls,"gen","poema","def",1)])};var Ul="lin-u2-l4",Ff={id:Ul,titulo:"Anúncio, campanha, charge e tirinha",temas:["generos"],cartoes:[{tipo:"conceito",titulo:"Anúncio e campanha",texto:"Anúncio publicitário quer vender: slogan, imagem do produto e imperativo. Campanha social mobiliza o público por uma causa, sem fim comercial.",fig:{kind:"lin-gen-recorte",genero:"anuncio",hl:["slogan","imagem"]}},{tipo:"pegadinha",titulo:"Anúncio × propaganda institucional",texto:"O anúncio vende um produto. A propaganda institucional promove a imagem ou as ações de quem assina. Olhe o canto inferior: produto ou instituição?"},{tipo:"exemplo",titulo:"Charge × cartum",texto:"Charge critica com humor um fato do momento e só funciona com esse contexto. Cartum faz humor atemporal e se entende sem data.",fig:{kind:"lin-gen-recorte",genero:"charge",hl:["fato"]}},{tipo:"conceito",titulo:"Tirinha: piada em quadros",texto:"Tirinha conta uma cena curta, em geral cômica, em poucos quadros com balões. O desfecho vem no último quadro.",fig:{kind:"lin-gen-recorte",genero:"tirinha",hl:["q1","q2","q3","balao"]}}],exercicios:Z([b("lin-gen-anuncio-d"),b("lin-gen-charge-d"),b("lin-enem-gen-campanha-sangue"),b("lin-gen-tirinha-f3"),di(Ul,"tirinha","tirinha",1),b("lin-gen-cartum-d"),qo(Ul,"gen",["anuncio","charge","cartum","poema"],"def",{nivel:2})])};var Nr="lin-u2-l5",_f={id:Nr,titulo:"Cartas, resenha e entrevista",temas:["generos"],cartoes:[{tipo:"conceito",titulo:"Carta aberta × carta do leitor",texto:"Carta aberta reivindica algo em público, em nome de um grupo. Carta do leitor é curta, assinada e comenta uma matéria já publicada no veículo.",fig:{kind:"lin-gen-recorte",genero:"cartaaberta",hl:["vocativo","assin"]}},{tipo:"conceito",titulo:"Resenha: resume e avalia",texto:"Resenha apresenta e descreve uma obra e depois a avalia, com pontos fortes e fracos. O resumo só condensa, sem julgar.",fig:{kind:"lin-gen-recorte",genero:"resenha",hl:["aval"]}},{tipo:"exemplo",titulo:"Entrevista, verbete e receita",texto:"Entrevista alterna perguntas e respostas. Verbete traz a palavra-entrada e suas definições. Receita lista ingredientes e modo de preparo no imperativo.",fig:{kind:"lin-gen-recorte",genero:"entrevista",hl:["p1","r1","p2"]}},{tipo:"pegadinha",titulo:"Gêneros híbridos",texto:"O ENEM gosta de misturar: um poema em forma de receita, uma propaganda em forma de verbete. Ache o gênero pela função real do texto, não pela forma emprestada."}],exercicios:Z([b("lin-gen-cartaaberta-f1"),b("lin-gen-resenha-f4"),b("lin-enem-gen-resenha-farol"),b("lin-gen-entrevista-f1"),Ao(Nr,"gen","cartaaberta","cartaleitor",2,"def"),Ao(Nr,"gen","resumo","resumo",2,"def"),mi(Nr,"resenha",2),qo(Nr,"gen",["verbete","receita","entrevista"],"def",{nivel:2})])};var Bf={id:"lin-u3",titulo:"Funções da linguagem",descricao:"Referencial, emotiva, conativa, fática, metalinguística e poética: ache o foco e a marca no texto.",temas:["funcoes","intencao"],desafio:Z([b("lin-fun-conativa-nome2marca-7"),b("lin-fun-referencial-def2nome-11"),b("lin-enem-fun-meus-oito-anos",{enunciado:"A função predominante se evidencia pelo(a)…"}),b("lin-fun-poetica-exemplo2nome-18"),b("lin-enem-fun-campanha-vacina"),b("lin-fun-poetica-nome2marca-8"),b("lin-enem-fun-verbete-saudade"),b("lin-fun-metalinguisticaF-nome2def-9"),b("lin-enem-fun-au
